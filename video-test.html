<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Unity DROP Video Test</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;}body{min-height:100dvh;display:flex;flex-direction:column}.bar{padding:max(14px,env(safe-area-inset-top)) 16px 14px;background:#111;border-bottom:1px solid #2a2a2a;z-index:3}.bar strong{font-size:14px}.bar p{margin:5px 0 0;color:#999;font-size:11px}.buttons{display:flex;gap:8px;padding:12px;background:#0b0b0b;z-index:3}.buttons button{flex:1;border:1px solid #444;background:#171717;color:#fff;border-radius:8px;padding:12px 4px;font-size:12px}.stage{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;background:#000}.stage video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.skip{position:absolute;right:16px;top:16px;z-index:2;border:1px solid #ffffff44;background:#0008;color:#fff;border-radius:999px;padding:10px 14px}.status{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;background:#000b;border:1px solid #ffffff33;border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.hint{color:#bbb;text-align:center;padding:20px;font-size:13px;line-height:1.7}.done{font-weight:700;color:#b8ffce}
  </style>
</head>
<body>
  <div class="bar"><strong>Unity DROP 動画テスト</strong><p>抽選API・在庫・結果保存は一切使用しません。</p></div>
  <div class="buttons">
    <button data-rarity="common">COMMON</button>
    <button data-rarity="rare">RARE</button>
    <button data-rarity="secret">SECRET</button>
  </div>
  <div class="stage">
    <div class="hint" id="hint">上のボタンを押すと動画だけ再生します。<br>終了・エラー・SKIPの動作確認用です。</div>
    <video id="video" muted playsinline webkit-playsinline preload="none"></video>
    <button id="skip" class="skip" type="button" hidden>SKIP</button>
    <div id="status" class="status">待機中</div>
  </div>
  <script>
    const base='https://raw.githubusercontent.com/nyokki519/Unity-DROP/codex/video-player-final/assets/videos/';
    const sources={common:base+'common.mp4',rare:base+'rare.mp4',secret:base+'secret.mp4'};
    const video=document.getElementById('video');
    const skip=document.getElementById('skip');
    const status=document.getElementById('status');
    const hint=document.getElementById('hint');
    let timer=null;
    function finish(reason){clearTimeout(timer);video.pause();video.removeAttribute('src');video.load();skip.hidden=true;hint.hidden=false;status.textContent=`完了: ${reason}`;status.classList.add('done');}
    function play(rarity){clearTimeout(timer);status.classList.remove('done');hint.hidden=true;skip.hidden=false;status.textContent=`再生中: ${rarity.toUpperCase()}`;video.muted=true;video.defaultMuted=true;video.playsInline=true;video.src=sources[rarity];timer=setTimeout(()=>finish('15秒タイムアウト'),15000);try{Promise.resolve(video.play()).catch(()=>finish('再生失敗フォールバック'));}catch(_){finish('再生失敗フォールバック')}}
    document.querySelectorAll('[data-rarity]').forEach(btn=>btn.addEventListener('click',()=>play(btn.dataset.rarity)));
    video.addEventListener('ended',()=>finish('動画終了'));
    video.addEventListener('error',()=>finish('動画エラー'));
    skip.addEventListener('click',()=>finish('SKIP'));
  </script>
</body>
</html>
