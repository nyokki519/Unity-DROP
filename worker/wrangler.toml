name = "unity-drop-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
keep_vars = true

[vars]
# Initial defaults before the first authenticated settings update.
CONFIG_URL = "https://raw.githubusercontent.com/nyokki519/Unity-DROP/main/drop-config.json"
ALLOWED_ORIGINS = "https://nyokki519.github.io,http://localhost:4173"

[[durable_objects.bindings]]
name = "EVENT_POOLS"
class_name = "EventPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventPool"]

[[durable_objects.bindings]]
name = "DROP_SETTINGS"
class_name = "DropSettings"

[[migrations]]
tag = "v2-drop-settings"
new_sqlite_classes = ["DropSettings"]
