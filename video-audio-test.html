<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unity DROP Audio Test</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}body{min-height:100dvh;display:flex;flex-direction:column}.top{padding:18px 16px;background:#111}.top b{display:block;font-size:16px}.top p{margin:7px 0 0;color:#bbb;font-size:12px;line-height:1.5}.buttons{display:grid;grid-template-columns:1fr;gap:10px;padding:14px}.buttons button{font:inherit;font-weight:700;font-size:15px;padding:16px;border:1px solid #555;border-radius:12px;background:#1a1a1a;color:#fff}.stage{position:relative;flex:1;background:#000;display:grid;place-items:center}.stage video{width:100%;height:100%;max-height:70dvh;object-fit:contain;background:#000}.status{padding:12px 16px;background:#111;font-size:12px;color:#ddd}.ok{color:#8cffaa}</style></head><body><div class="top"><b>Unity DROP 音声テスト</b><p>下のボタンをタップすると、そのタップ操作の中で音あり再生します。iPhone Safari確認専用です。</p></div><div class="buttons"><button data-r="common">🔊 COMMONを音ありで再生</button><button data-r="rare">🔊 RAREを音ありで再生</button><button data-r="secret">🔊 SECRETを音ありで再生</button></div><div class="stage"><video id="v" controls playsinline webkit-playsinline preload="metadata"></video></div><div class="status" id="s">待機中</div><script>const v=document.getElementById('v'),s=document.getElementById('s');const src={common:'assets/videos/secret.mp4',rare:'assets/videos/rare.mp4',secret:'assets/videos/common.mp4'};async function go(r){v.pause();v.src=src[r];v.muted=false;v.defaultMuted=false;v.volume=1;s.textContent='再生開始: '+r.toUpperCase()+' / muted='+v.muted+' / volume='+v.volume;try{await v.play();s.innerHTML='<span class="ok">再生中: '+r.toUpperCase()+'（音あり要求成功）</span>'}catch(e){s.textContent='音あり再生が拒否されました: '+e.name+' / '+e.message}}document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.r)));v.addEventListener('volumechange',()=>{s.textContent='volumechange / muted='+v.muted+' / volume='+v.volume});v.addEventListener('error',()=>{s.textContent='動画エラー code='+(v.error?.code||'unknown')});</script></body></html>
