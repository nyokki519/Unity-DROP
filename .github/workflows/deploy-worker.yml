name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install dependencies
        run: npm install

      - name: Verify inventory and immediate settings
        run: npm test

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test event API
        run: |
          # Worker routing propagation can briefly return the previous deployment.
          for attempt in 1 2 3 4 5; do
            response=$(curl --fail-with-body --silent --show-error --max-time 20 \
              -X POST 'https://unity-drop-api.kukki519.workers.dev/api/event' \
              -H 'Origin: https://nyokki519.github.io' \
              -H 'Content-Type: application/json' \
              --data '{}') || response='{"error":"connection_failed"}'
            if node --input-type=module -e 'import {currentJstEventId} from "./src/index.js"; const x=JSON.parse(process.argv[1]); if (Math.floor(x.eventId/100) !== currentJstEventId() || !Number.isSafeInteger(x.totalDraws) || x.totalDraws<1 || x.configVersion!==3) process.exit(1)' "$response"; then
              echo "$response"
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::DROP event verification failed: $response"
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test session API
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST 'https://unity-drop-api.kukki519.workers.dev/api/session' \
            -H 'Origin: https://nyokki519.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "$response" | sed -E 's/("token"[[:space:]]*:[[:space:]]*")[^"]+"/\1***"/'
          node -e 'const x=JSON.parse(process.argv[1]); if (typeof x.token !== "string" || !x.token.includes(".")) process.exit(1)' "$response"
